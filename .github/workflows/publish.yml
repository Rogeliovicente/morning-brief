name: Publish The Morning Brief

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
      - "index.html"
      - "CONTRIBUTING.md"
  workflow_dispatch:
    inputs:
      action:
        description: "Generar vista previa o publicar la edición aprobada"
        required: true
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: read

concurrency:
  group: morning-brief-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate edition if one has been prepared
        run: |
          if [ -f content/edition.json ]; then
            python scripts/edition.py validate
          else
            echo "No content/edition.json yet; setup-only run, no edition to preview."
          fi

      - name: Build edition preview
        if: github.event_name == 'pull_request' || inputs.action == 'preview'
        run: |
          if [ -f content/edition.json ]; then
            python scripts/edition.py build --output-dir _preview
            cp index.html _preview/index.html
          else
            echo "No edition content yet; skipping preview artifact."
          fi

      - name: Upload preview artifact
        if: (github.event_name == 'pull_request' || inputs.action == 'preview') && hashFiles('content/edition.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: edition-preview
          path: _preview
          if-no-files-found: error
          retention-days: 14

      - name: Build Pages site
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
        run: |
          test -f content/edition.json || { echo "No edition content; publication stopped."; exit 1; }
          python scripts/edition.py build --output-dir _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish approved edition
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
